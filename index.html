<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LLM 심화 — Transformer 와 LLMs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="_tools/교재.css">
  <style>
    /* docsify 레이아웃 보정 — 교재.css 의 body 폭 규칙(17cm 중앙 정렬)은
       VS Code 미리보기/pandoc 용이다. docsify 에서는 body 가 앱 전체 컨테이너라
       그대로 두면 고정 사이드바(300px)와 본문 사이가 벌어진다.
       폭 제한은 본문 컨테이너(.markdown-section)로 옮기고, 사이드바 쪽으로 붙인다. */
    body { max-width: none; margin: 0; }
    .markdown-section { max-width: var(--본문폭); margin: 0; padding: 30px 30px 40px 45px; }

    /* 페이지별 오류 신고 상자 (ADA 교재와 같은 구성) */
    .ada-report { margin: 3rem 0 1rem; border-top: 1px solid #eaecef; padding-top: 1rem; }
    .ada-report summary { cursor: pointer; color: #6a737d; font-size: .9rem; }
    .ada-report summary:hover { color: var(--theme-color, #42b983); }
    .ada-report[open] summary { color: var(--theme-color, #42b983); margin-bottom: .8rem; }
    .ada-report .hint { font-size: .82rem; color: #6a737d; line-height: 1.6; margin: 0 0 .8rem; }
    .ada-report input, .ada-report textarea {
      width: 100%; box-sizing: border-box; padding: .5rem .6rem; margin-bottom: .6rem;
      border: 1px solid #d1d5da; border-radius: 4px; font: inherit; font-size: .9rem;
    }
    .ada-report textarea { resize: vertical; }
    .ada-report .ada-send {
      display: inline-block; background: var(--theme-color, #42b983); color: #fff;
      border-radius: 4px; padding: .5rem 1rem; font-size: .9rem;
      cursor: pointer; text-decoration: none;
    }
    .ada-report .ada-send:hover { opacity: .88; color: #fff; text-decoration: none; }
    .ada-report .warn { color: #b34; font-size: .82rem; margin-left: .6rem; }
  </style>
</head>
<body>
  <div id="app">로딩 중…</div>

  <script>
    // ── 오류 신고 상자 ────────────────────────────────────────────────
    // 입력 내용을 GitHub 이슈 작성 화면에 미리 채워 열어 준다.
    // (정적 사이트라 토큰 없이 직접 등록할 수는 없다 — 마지막 제출은 사용자가 누른다)
    var ADA = {
      repo: 'https://github.com/AI-BoostCamp/AgenticAI',
      label: '교재오류',
      max: 5000,                       // 프리필 URL 이 지나치게 길어지는 것을 막는다

      reportBox: function (file) {
        return '<div class="ada-report" data-file="' + file + '">'
          + '<details><summary>내용 오류 · 깨진 수식 · 잘못된 그림을 발견하면 기록해 주세요</summary>'
          + '<p class="hint">아래에 적고 <b>GitHub 에 등록</b>을 누르면 내용이 채워진 이슈 작성 화면이 열립니다. '
          + '거기서 <b>Submit new issue</b> 를 눌러야 등록이 끝납니다. (GitHub 로그인 필요)</p>'
          + '<input type="text" class="ada-where" placeholder="위치 — 예: 1.3.4 · 그림 · 실습 2.3.1">'
          + '<textarea class="ada-what" rows="4" placeholder="무엇이 잘못되었는지 적어 주세요."></textarea>'
          + '<a class="ada-send" href="#" target="_blank" rel="noopener">GitHub 에 등록</a>'
          + '<span class="warn"></span>'
          + '</details></div>';
      },

      bind: function () {
        document.querySelectorAll('.ada-report').forEach(function (box) {
          var btn = box.querySelector('.ada-send');
          if (!btn || btn.dataset.bound) return;
          btn.dataset.bound = '1';
          btn.addEventListener('click', function (ev) {
            var warn  = box.querySelector('.warn');
            var what  = box.querySelector('.ada-what').value.trim();
            var where = box.querySelector('.ada-where').value.trim();
            if (!what) { ev.preventDefault(); warn.textContent = '내용을 적어 주세요.'; return; }

            var file = box.dataset.file;                 // 라우터가 주는 값은 URL 인코딩되어 있다
            var nice = decodeURIComponent(file);         // 사람이 읽을 경로
            var h1   = document.querySelector('.markdown-section h1');
            var name = h1 ? h1.textContent.trim() : nice.replace(/\.md$/, '');
            var url  = location.origin + location.pathname + '#/' + file.replace(/\.md$/, '');

            var body = '**페이지**: `' + nice + '`\n'
                     + '**주소**: [' + name + '](' + url + ')\n'
                     + (where ? '**위치**: ' + where + '\n' : '')
                     + '\n' + what + '\n\n'
                     + '<sub>교재 페이지 하단의 오류 신고로 작성됨</sub>';

            if (body.length > ADA.max) {
              ev.preventDefault();
              warn.textContent = '내용이 너무 깁니다. 줄여 주세요.'; return;
            }
            warn.textContent = '';
            // href 를 채워 두면 브라우저가 평범한 링크로 새 탭을 연다 — 팝업 차단과 무관하다
            btn.href = ADA.repo + '/issues/new'
              + '?labels=' + encodeURIComponent(ADA.label)
              + '&title='  + encodeURIComponent('[교재오류] ' + name)
              + '&body='   + encodeURIComponent(body);
          });
        });
      }
    };

    window.$docsify = {
      name: 'LLM 심화',
      repo: 'https://github.com/AI-BoostCamp/AgenticAI',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      alias: {
        // 장 폴더 하위 어디서든 같은 사이드바를 쓰게 함
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: { placeholder: '검색', noData: '결과 없음', depth: 3 },

      // 페이지마다 하단에 오류 신고 상자를 붙인다.
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html, next) {
            var file = (vm.route && vm.route.file) || '';
            if (!file) return next(html);
            next(html + ADA.reportBox(file));
          });
          hook.doneEach(function () { ADA.bind(); });
        }
      ]
    };
  </script>
  <!-- 스크립트 로드 순서: katex → marked@4 → docsify-katex 를 docsify 본체보다 먼저 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
